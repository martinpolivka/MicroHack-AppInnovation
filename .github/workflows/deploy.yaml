name: Deploy Java catalog

on:
  push:
    branches:
      - main
    paths:
      - java/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CONTAINER_APP_NAME: lego-catalog-app
  IMAGE_NAME: lego-catalog-app

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Sign in to Azure
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          az acr login --name "$ACR_NAME"
          docker build --tag "$IMAGE" java
          docker push "$IMAGE"

      - name: Deploy image to Azure Container Apps
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.run_id }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
        run: |
          set -Eeuo pipefail
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --image "$IMAGE" \
            --output none